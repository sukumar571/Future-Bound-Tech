# ========================================
# Test profile — isolated, in-memory H2
# ========================================
# These properties are on the TEST classpath and shadow src/main/resources.
# They deliberately use an IN-MEMORY H2 database (MODE=MySQL to match the
# production/H2 URL semantics) so the suite never touches, and never collides
# with, the file database the running dev server locks at ./data.

spring.application.name=Future Bound Tech (tests)

# ---- In-memory database (isolated per JVM, fresh schema) ----
spring.datasource.url=jdbc:h2:mem:fbt-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Console is not needed in tests and would expose /h2-console.
spring.h2.console.enabled=false

# ---- View layer ----
spring.thymeleaf.cache=false

# ---- Payments: gateway disabled -> deterministic DEMO settlement path (no network) ----
razorpay.enabled=false
razorpay.key.id=rzp_test_123
razorpay.key.secret=test_key_secret
razorpay.webhook.secret=test_webhook_secret

# ---- Uploads: keep everything inside the build's target folder ----
app.upload-dir=./target/test-uploads
app.private-upload-dir=./target/test-private-uploads
app.base-url=http://localhost

# ---- Email + scheduled sweeps are switched off during tests ----
app.email.enabled=false
app.email.from=
app.notifications.reminders.enabled=false

# ---- Multipart limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Quiet logging for tests ----
logging.level.root=WARN
logging.level.com.futureboundtech=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
