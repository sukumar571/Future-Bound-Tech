# ========================================
# Future Bound Tech — Application Config
# ========================================

spring.application.name=Future Bound Tech

# Default to H2 when MySQL credentials are unavailable.
# For MySQL: --spring.profiles.active=mysql  (and set DB_* env vars if needed)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# The production profile always runs on top of the MySQL datasource.
# (Profile groups must live in this base file — Spring ignores them in
# profile-specific documents.)
spring.profiles.group.prod=mysql

# ---- Server ----
server.port=8080
server.error.whitelabel.enabled=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ---- File Upload ----
# Per-upload size caps are enforced again in code (FileValidator). These are the
# container-level multipart limits.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}

# ---- Logging ----
logging.level.root=INFO
logging.level.com.futureboundtech=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
# Windows consoles run on a legacy codepage; without this, non-ASCII message
# characters (em dashes, etc.) are rendered as garbage in the terminal.
logging.charset.console=${LOG_CONSOLE_CHARSET:cp1252}

# ---- Razorpay ----
# Supply real test-mode credentials via environment variables:
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
razorpay.enabled=${RAZORPAY_ENABLED:false}

# ---- App Settings ----
# Public assets (branding, course thumbnails, trainer/student photos) are served
# statically from this folder at /uploads/**. Private files (lesson notes,
# assignment attachments, submissions) live in app.private-upload-dir, which is
# OUTSIDE the web-served folder and reachable only via authorized endpoints.
app.upload-dir=${UPLOAD_DIR:./uploads}
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:./data/private-uploads}
# Public base URL used on certificates (verification links).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ---- Notifications ----
# Hourly sweep that turns upcoming classes and approaching deadlines into reminders.
app.notifications.reminders.enabled=${NOTIFICATION_REMINDERS_ENABLED:true}
app.notifications.reminders.cron=${NOTIFICATION_REMINDERS_CRON:0 0 * * * *}
app.notifications.reminders.class-lead-minutes=${NOTIFICATION_CLASS_LEAD_MINUTES:120}
app.notifications.reminders.assignment-lead-hours=${NOTIFICATION_ASSIGNMENT_LEAD_HOURS:24}

# ---- Email (optional) ----
# The institute's notification address has not been decided yet, so e-mail ships
# switched OFF and no address is written anywhere in this file or in the code.
# To enable it, set these environment variables:
#   APP_EMAIL_ENABLED=true
#   APP_EMAIL_FROM=<the address notifications should appear to come from>
#   APP_EMAIL_SUBJECT_PREFIX="[Future Bound Tech]"   (optional)
# and point Spring Boot's standard SMTP settings at your provider:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
# Nothing is sent until all three of enabled + from + host are present; until then
# notifications stay in-app only.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:}
app.email.subject-prefix=${APP_EMAIL_SUBJECT_PREFIX:}

# ---- Future Mentor AI assistant (OPTIONAL) ----
# A learning assistant for the student portal. It is entirely optional and is
# NEVER a dependency for the core LMS: with AI disabled the assistant still works
# as a local, rules-based study guide. No API key is committed here — supply one
# only through the environment. See docs/DEPLOYMENT.md / docs/API.md.
#   feature switch (page + endpoints)     : FUTURE_MENTOR_ENABLED
#   real AI provider calls (needs a key)  : FUTURE_MENTOR_AI_ENABLED + FUTURE_MENTOR_API_KEY
#   persist chat history                  : FUTURE_MENTOR_HISTORY_ENABLED (privacy: only the
#                                           signed-in student's own turns are stored, never
#                                           shared, and are deletable on request via the UI/API)
future-mentor.enabled=${FUTURE_MENTOR_ENABLED:true}
future-mentor.ai-enabled=${FUTURE_MENTOR_AI_ENABLED:false}
future-mentor.provider=${FUTURE_MENTOR_PROVIDER:openai}
future-mentor.api-key=${FUTURE_MENTOR_API_KEY:}
future-mentor.base-url=${FUTURE_MENTOR_BASE_URL:https://api.openai.com/v1}
future-mentor.model=${FUTURE_MENTOR_MODEL:gpt-4o-mini}
future-mentor.max-tokens=${FUTURE_MENTOR_MAX_TOKENS:500}
future-mentor.temperature=${FUTURE_MENTOR_TEMPERATURE:0.4}
future-mentor.timeout-seconds=${FUTURE_MENTOR_TIMEOUT_SECONDS:20}
future-mentor.history-enabled=${FUTURE_MENTOR_HISTORY_ENABLED:true}
future-mentor.history-max-turns-sent=${FUTURE_MENTOR_HISTORY_MAX_TURNS:10}
future-mentor.rate-limit.requests-per-minute=${FUTURE_MENTOR_RATE_LIMIT_RPM:12}
future-mentor.rate-limit.max-input-chars=${FUTURE_MENTOR_MAX_INPUT_CHARS:2000}
