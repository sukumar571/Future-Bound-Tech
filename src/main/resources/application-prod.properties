# ================================================================
# Future Bound Tech — PRODUCTION profile
# Activate with:  --spring.profiles.active=prod   (or SPRING_PROFILES_ACTIVE=prod)
# Groups the "mysql" profile (declared in the base application.properties),
# so all DB_* variables below apply. Every secret is read from an environment
# variable — nothing in this file is replaced with a real value, and no
# default fallback is offered for credentials that must exist in production.
# ================================================================

# ---- Public URL (set to your real HTTPS origin at deploy time) ----
app.base-url=${APP_BASE_URL}

# ---- Server / HTTPS behind a reverse proxy ----
# The app speaks plain HTTP on an internal port; nginx/Caddy terminates TLS
# and forwards X-Forwarded-* headers, which "native" honours for redirects
# and secure-cookie decisions.
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Never leak stack traces or internal messages on the HTML error page.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---- MySQL production datasource (from application-mysql.properties) ----
# Deliberately NO default password: the app refuses to start without DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
# useSSL=false from the dev mysql profile is not acceptable in production.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:future_bound_tech_db}?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=UTC

# ---- Schema strategy ----
# Hibernate "update" keeps deployments simple; before the FIRST release, take
# a full mysqldump (see deploy/BACKUP.bat) and review the generated DDL in the
# startup log. See DEPLOYMENT.md "Database migration strategy".
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---- Frontend assets ----
# Cache Thymeleaf templates and serve static resources with long-lived,
# gzipped responses (the reverse proxy compresses; assets are versioned by
# the CDN SRI links in fragments/head.html).
spring.thymeleaf.cache=true
spring.web.resources.cache.period=${STATIC_CACHE_PERIOD:3600}
spring.web.resources.chain.cache=true

# ---- Logging: file output, no SQL echo ----
logging.level.root=INFO
logging.level.com.futureboundtech=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.file.name=${LOG_FILE:/var/log/future-bound-tech/app.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=1GB

# ---- Payments ----
# Placeholder/demo mode must never run in production: razorpay.enabled is
# forced true and ProductionValidator fails startup if the keys are missing
# or still contain the placeholder values. Use the "test" keys only while
# explicitly staging against Razorpay Test Mode.
razorpay.enabled=true
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ---- Demo/seed data is OFF in production ----
# For the very first deployment set BOOTSTRAP_SEEDS=true once (creates the
# catalog + admin), then turn it off. The bootstrap admin password comes from
# ADMIN_SEED_PASSWORD — the "password" default is refused by ProductionValidator.
app.seeders.enabled=${BOOTSTRAP_SEEDS:false}
app.seed.admin-email=${ADMIN_SEED_EMAIL}
app.seed.admin-password=${ADMIN_SEED_PASSWORD}

# ---- H2 console must not exist in a production runtime ----
spring.h2.console.enabled=false

# ---- Uploads (persistent volumes, outside the web root) ----
app.upload-dir=${UPLOAD_DIR:/var/opt/future-bound-tech/uploads}
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:/var/opt/future-bound-tech/private-uploads}

# ---- Outbound e-mail ----
# Stays opt-in exactly like the base config: enable it by setting
# APP_EMAIL_ENABLED=true plus the standard SPRING_MAIL_* environment variables.

# ---- HTTPS hardening (see SecurityConfig, driven by APP_HSTS_ENABLED) ----
app.security.hsts-enabled=${APP_HSTS_ENABLED:true}
