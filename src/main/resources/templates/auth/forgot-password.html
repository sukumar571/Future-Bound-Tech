<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1020">
    <title>Forgot Password — Future Bound Tech</title>

    <link rel="icon" th:href="@{/images/logo.png}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-shell">

    <div class="auth-pane" style="min-height: 100vh;">
        <div class="auth-panel text-center">
            <div class="icon-chip mx-auto mb-3" style="width:64px;height:64px;border-radius:50%;font-size:1.6rem;">
                <i class="bi bi-key-fill"></i>
            </div>
            <h1 class="auth-title">Forgot password?</h1>
            <p class="auth-subtitle">No worries — we'll send you reset instructions.</p>

            <!-- Success Message -->
            <div th:if="${message}" class="alert alert-success text-start mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger text-start mb-4" role="alert">
                <i class="bi bi-exclamation-octagon-fill me-2"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="POST" class="text-start">
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com"
                            required autofocus autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 mb-4 py-2">
                    Send reset instructions <i class="bi bi-send ms-2"></i>
                </button>

                <div class="text-center">
                    <a th:href="@{/login}" class="text-muted text-decoration-none small fw-semibold"><i
                            class="bi bi-arrow-left me-1"></i> Back to log in</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
