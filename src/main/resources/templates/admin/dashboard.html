<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="admin-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('dashboard')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="welcome-banner p-4 mb-4">
                        <div class="d-flex align-items-center gap-3 flex-wrap">
                            <div class="avatar-circle"><i class="bi bi-shield-lock"></i></div>
                            <div class="flex-grow-1">
                                <h1 class="h4 mb-1 text-white">Admin control center</h1>
                                <p class="mb-0 text-white-50">Live institute analytics from the MySQL database.</p>
                            </div>
                            <a th:href="@{/admin/students}" class="btn btn-light fw-semibold"><i class="bi bi-person-plus me-1"></i> Add student</a>
                        </div>
                    </div>

                    <!-- Stat cards -->
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-4 col-xl-3" th:each="card : ${ {
                                {'students', 'People', stats.totalStudents, 'bi-mortarboard', 'text-bg-primary'},
                                {'trainers', 'Trainers', stats.totalTrainers, 'bi-person-video3', 'text-bg-info'},
                                {'courses', 'Courses', stats.totalCourses, 'bi-journal-bookmark', 'text-bg-success'},
                                {'enrollments', 'Enrollments', stats.totalEnrollments, 'bi-ui-checks', 'text-bg-warning'},
                                {'revenue', 'Total revenue', stats.totalRevenue, 'bi-currency-rupee', 'text-bg-primary'},
                                {'successful', 'Successful payments', stats.successfulPayments, 'bi-check2-circle', 'text-bg-success'},
                                {'pending', 'Pending payments', stats.pendingPayments, 'bi-hourglass-split', 'text-bg-warning'},
                                {'failed', 'Failed payments', stats.failedPayments, 'bi-x-octagon', 'text-bg-danger'},
                                {'classes', 'Upcoming classes', stats.upcomingClasses, 'bi-camera-video', 'text-bg-info'},
                                {'batches', 'Batches', stats.totalBatches, 'bi-collection', 'text-bg-secondary'},
                                {'certificates', 'Certificates', stats.certificatesIssued, 'bi-award', 'text-bg-dark'},
                                {'messages', 'Unread messages', stats.unreadMessages, 'bi-envelope', 'text-bg-danger'}
                            } }">
                            <div class="card stat-card shadow-sm">
                                <div class="card-body d-flex align-items-center gap-3">
                                    <div class="stat-icon" th:classappend="${card[4]}"><i class="bi" th:classappend="${card[3]}"></i></div>
                                    <div>
                                        <div class="stat-value" th:text="${card[2]}">0</div>
                                        <div class="stat-label" th:text="${card[1]}">Label</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="row g-4 mb-4">
                        <div class="col-lg-7">
                            <div class="card chart-card shadow-sm h-100">
                                <div class="card-header bg-white fw-semibold">Enrollments by course</div>
                                <div class="card-body">
                                    <div class="chart-wrap"><canvas id="enrollChart"></canvas></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-5">
                            <div class="card chart-card shadow-sm h-100">
                                <div class="card-header bg-white fw-semibold">Payments by status</div>
                                <div class="card-body">
                                    <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent registrations -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
                            <span>Recent student registrations</span>
                            <a th:href="@{/admin/students}" class="btn btn-sm btn-outline-primary">View all</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table data-table mb-0 align-middle">
                                <thead class="table-light">
                                    <tr><th>Name</th><th>Email</th><th>Status</th><th>Joined</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${stats.recentRegistrations}">
                                        <td th:text="${u.fullName}">Name</td>
                                        <td th:text="${u.email}">Email</td>
                                        <td>
                                            <span class="badge" th:classappend="${u.active} ? 'text-bg-success' : 'text-bg-secondary'"
                                                  th:text="${u.active} ? 'Active' : 'Inactive'">Active</span>
                                        </td>
                                        <td th:text="${#temporals.format(u.createdAt, 'd MMM yyyy')}">Date</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(stats.recentRegistrations)}">
                                        <td colspan="4"><div class="empty-state"><i class="bi bi-people"></i>No registrations yet.</div></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var enrollData = /*[[${stats.enrollmentsByCourse}]]*/ [];
        var revenueData = /*[[${stats.revenueByStatus}]]*/ [];
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof Chart === 'undefined') { return; }
            /* Phase 24 — colorful premium brand palette */
            var FBT_COLORS = ['#2563EB', '#7C3AED', '#06B6D4', '#FACC15', '#EC4899', '#10B981', '#F59E0B', '#0EA5E9'];
            Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
            Chart.defaults.color = 'rgba(71, 85, 105, 0.85)';
            var e = document.getElementById('enrollChart');
            if (e) {
                new Chart(e, {
                    type: 'bar',
                    data: {
                        labels: enrollData.map(function (d) { return d.name; }),
                        datasets: [{ label: 'Enrollments', data: enrollData.map(function (d) { return d.value; }),
                            backgroundColor: enrollData.map(function (d, i) { return FBT_COLORS[i % FBT_COLORS.length]; }),
                            hoverBackgroundColor: '#1D4ED8', borderRadius: 8, maxBarThickness: 46 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, border: { display: false } },
                            y: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.18)' }, border: { display: false }, ticks: { precision: 0 } }
                        }
                    }
                });
            }
            var r = document.getElementById('revenueChart');
            if (r) {
                new Chart(r, {
                    type: 'doughnut',
                    data: {
                        labels: revenueData.map(function (d) { return d.name; }),
                        datasets: [{ data: revenueData.map(function (d) { return d.value; }),
                            backgroundColor: revenueData.map(function (d, i) { return FBT_COLORS[i % FBT_COLORS.length]; }),
                            borderColor: '#fff', borderWidth: 2, hoverOffset: 8 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '62%',
                        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', padding: 16, boxWidth: 8 } } }
                    }
                });
            }
        });
        /*]]>*/
    </script>
</body>

</html>
