<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>
    <section class="admin-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('coupons')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="admin-page-head">
                        <h1 class="h3" th:text="${editing} ? 'Edit coupon' : 'New coupon'">Coupon</h1>
                        <a th:href="@{/admin/coupons}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Back to coupons</a>
                    </div>

                    <div class="card form-card shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="${formAction}" th:object="${couponDto}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Coupon code</label>
                                        <input type="text" class="form-control text-uppercase" th:field="*{code}" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" placeholder="e.g. FESTIVE25">
                                        <div class="invalid-feedback" th:errors="*{code}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Discount amount (₹)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{discountAmount}" th:classappend="${#fields.hasErrors('discountAmount')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{discountAmount}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Valid until</label>
                                        <input type="datetime-local" class="form-control" th:field="*{validUntil}" th:classappend="${#fields.hasErrors('validUntil')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{validUntil}"></div>
                                    </div>
                                    <div class="col-md-6 d-flex align-items-end">
                                        <div class="form-check ms-2">
                                            <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                                            <label class="form-check-label" for="active">Coupon active</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i> Save</button>
                                    <a th:href="@{/admin/coupons}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
