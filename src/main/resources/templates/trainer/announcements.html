<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>
    <section class="admin-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/trainer-sidebar :: trainerSidebar('announcements')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="admin-page-head">
                        <div>
                            <h1 class="h3">Announcements</h1>
                            <p class="text-muted mb-0">Send announcements to your assigned batches.</p>
                        </div>
                        <a th:href="@{/trainer/announcements/new}" class="btn btn-primary"><i class="bi bi-megaphone me-1"></i> New announcement</a>
                    </div>

                    <div class="row g-3">
                        <div class="col-12" th:if="${#lists.isEmpty(announcements)}">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body"><div class="empty-state mb-0"><i class="bi bi-megaphone"></i>No announcements yet.</div></div>
                            </div>
                        </div>
                        <div class="col-12" th:each="a : ${announcements}">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start gap-2">
                                        <div>
                                            <h2 class="h6 mb-1" th:text="${a.title}">Title</h2>
                                            <div class="small text-muted mb-2">
                                                <span class="badge text-bg-light" th:text="${a.batchName} ?: 'General'">Batch</span>
                                                <span th:if="${a.createdAt != null}" th:text="'· ' + ${#temporals.format(a.createdAt, 'd MMM yyyy, h:mm a')}">date</span>
                                            </div>
                                            <p class="mb-0" style="white-space:pre-line" th:text="${a.content}">Content</p>
                                        </div>
                                        <form th:action="@{/trainer/announcements/{id}/delete(id=${a.id})}" method="post"
                                              onsubmit="return confirm('Delete this announcement?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
