<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>
    <section class="admin-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/trainer-sidebar :: trainerSidebar('assignments')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="admin-page-head">
                        <div>
                            <h1 class="h3" th:text="${editing} ? 'Edit assignment' : 'New assignment'">Assignment</h1>
                            <p class="text-muted mb-0">Set the title, target batch and deadline.</p>
                        </div>
                        <a th:href="@{/trainer/assignments}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Back</a>
                    </div>

                    <div class="card border-0 shadow-sm form-card">
                        <div class="card-body p-4">
                            <form th:action="@{${formAction}}" th:object="${assignmentForm}" method="post" enctype="multipart/form-data">
                                <input type="hidden" th:field="*{id}">
                                <div class="mb-3">
                                    <label class="form-label" for="title">Title</label>
                                    <input type="text" id="title" th:field="*{title}" class="form-control"
                                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" placeholder="e.g. Spring Boot REST API project">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="description">Description</label>
                                    <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Instructions for students"></textarea>
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="batchId">Batch</label>
                                        <select id="batchId" th:field="*{batchId}" class="form-select"
                                                th:classappend="${#fields.hasErrors('batchId')} ? 'is-invalid'">
                                            <option value="">Select a batch</option>
                                            <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName} + ' — ' + ${b.courseTitle}">Batch</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('batchId')}" th:errors="*{batchId}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="dueDate">Deadline</label>
                                        <input type="datetime-local" id="dueDate" th:field="*{dueDate}" class="form-control"
                                               th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="maxMarks">Maximum marks</label>
                                        <input type="number" id="maxMarks" th:field="*{maxMarks}" class="form-control" min="0"
                                               placeholder="e.g. 100" th:classappend="${#fields.hasErrors('maxMarks')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maxMarks')}" th:errors="*{maxMarks}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="status">Status</label>
                                        <select id="status" th:field="*{status}" class="form-select">
                                            <option value="PUBLISHED">Published — visible to students</option>
                                            <option value="DRAFT">Draft — hidden from students</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-check mt-3">
                                    <input class="form-check-input" type="checkbox" id="allowLate" th:field="*{allowLate}">
                                    <label class="form-check-label" for="allowLate">Allow submissions after the deadline (late submissions will be flagged)</label>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label" for="attachmentFile">Attachment (optional — for students to download)</label>
                                    <input type="file" id="attachmentFile" th:field="*{attachmentFile}" class="form-control"
                                           accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.zip,.png,.jpg,.jpeg,.gif,.webp">
                                    <div class="form-text" th:if="${assignmentForm.attachmentName}">
                                        Current attachment: <strong th:text="${assignmentForm.attachmentName}">file</strong>. Upload a new file to replace it.
                                    </div>
                                    <div class="form-text">Max 10 MB. Allowed: PDF, Office documents, images, archives, and common data/code files.</div>
                                </div>
                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> <span th:text="${editing} ? 'Save changes' : 'Create assignment'">Save</span></button>
                                    <a th:href="@{/trainer/assignments}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
