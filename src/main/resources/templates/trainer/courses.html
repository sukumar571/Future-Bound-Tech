<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>
    <section class="admin-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/trainer-sidebar :: trainerSidebar('courses')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="admin-page-head">
                        <div>
                            <h1 class="h3">My courses</h1>
                            <p class="text-muted mb-0">Courses assigned to you. Manage their syllabus, modules, lessons, notes and videos.</p>
                        </div>
                    </div>

                    <div class="row g-4" th:if="${!courses.isEmpty()}">
                        <div class="col-lg-6" th:each="course : ${courses}">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body p-4 d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge text-bg-primary" th:text="${course.category.label}">Category</span>
                                        <span class="badge"
                                              th:classappend="${course.status.name() == 'PUBLISHED'} ? 'text-bg-success' : 'text-bg-secondary'"
                                              th:text="${#strings.capitalize(#strings.toLowerCase(course.status.name()))}">Status</span>
                                    </div>
                                    <h2 class="h5 fw-bold" th:text="${course.title}">Course</h2>
                                    <p class="text-muted small flex-grow-1" th:text="${course.shortDescription}">Description</p>
                                    <div class="d-flex gap-2 flex-wrap mb-2">
                                        <span class="badge text-bg-light text-dark" th:if="${course.level != null}">
                                            <i class="bi bi-bar-chart me-1"></i><span th:text="${course.level}">Level</span>
                                        </span>
                                        <span class="badge text-bg-light text-dark" th:if="${course.durationLabel != null}">
                                            <i class="bi bi-clock me-1"></i><span th:text="${course.durationLabel}">Duration</span>
                                        </span>
                                        <span class="badge text-bg-light text-dark">
                                            <i class="bi bi-collection me-1"></i>
                                            <span th:text="${batchCounts.getOrDefault(course.id, 0)} + ' batch(es)'">0 batch(es)</span>
                                        </span>
                                    </div>
                                    <div class="d-flex gap-2 mt-2 flex-wrap">
                                        <a class="btn btn-primary btn-sm" th:href="@{/trainer/courses/{id}/syllabus(id=${course.id})}">
                                            <i class="bi bi-list-task me-1"></i> Manage syllabus
                                        </a>
                                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/courses/{slug}(slug=${course.slug})}">
                                            <i class="bi bi-globe me-1"></i> Public page
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm text-center py-5" th:if="${courses.isEmpty()}">
                        <div class="card-body">
                            <i class="bi bi-journal-x fs-1 text-muted"></i>
                            <h3 class="mt-3">No courses assigned yet</h3>
                            <p class="text-muted mb-0">An administrator can assign you as the trainer of a course from the course form.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
