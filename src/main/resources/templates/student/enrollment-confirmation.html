<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm text-center p-4 p-md-5">
                        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle"
                             style="width:72px;height:72px;background:#DCFCE7;color:#16A34A;">
                            <i class="bi bi-check-lg" style="font-size:2.2rem;"></i>
                        </div>
                        <h1 class="h4 fw-bold mb-1">Enrollment confirmed!</h1>
                        <p class="text-muted mb-4" th:if="${enrollment.active}">
                            Your payment was received and your seat is now active.
                        </p>
                        <p class="text-muted mb-4" th:unless="${enrollment.active}">
                            Your enrollment record has been created.
                        </p>

                        <div class="text-start bg-light rounded p-4 mb-4">
                            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span class="text-muted">Course</span>
                                <span class="fw-semibold" th:text="${enrollment.courseTitle}">Course</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span class="text-muted">Batch</span>
                                <span th:text="${enrollment.batchName} ?: 'Assigned later'">Batch</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span class="text-muted">Training mode</span>
                                <span th:text="${enrollment.trainingModeLabel} ?: '—'">Mode</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span class="text-muted">Amount paid</span>
                                <span th:text="${enrollment.amountLabel} ?: '—'">₹0</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span class="text-muted">Enrollment date</span>
                                <span th:text="${enrollment.enrolledAt != null} ? ${#temporals.format(enrollment.enrolledAt, 'd MMM yyyy')} : '—'">date</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Status</span>
                                <span class="badge text-bg-success" th:text="${enrollment.statusLabel}">Active</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-center">
                            <a th:href="@{/student/courses/{id}(id=${enrollment.courseId})}" class="btn btn-primary">
                                <i class="bi bi-play-circle me-1"></i> Start learning
                            </a>
                            <a th:href="@{/student/enrollments}" class="btn btn-outline-secondary">View my enrollments</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
