<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('practice')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h4 mb-0"><i class="bi bi-code-slash me-2 text-info"></i>Coding Problems</h1>
                        <a th:href="@{/student/practice}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Practice</a>
                    </div>

                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <form th:action="@{/student/practice/coding}" method="get" class="row g-2 align-items-end">
                                <div class="col-md-5">
                                    <label class="form-label small mb-1">Category</label>
                                    <select name="category" class="form-select form-select-sm">
                                        <option value="">All categories</option>
                                        <option th:each="e : ${categoryOptions}" th:value="${e.key}" th:text="${e.value}" th:selected="${fCategory == e.key}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small mb-1">Difficulty</label>
                                    <select name="difficulty" class="form-select form-select-sm">
                                        <option value="">Any</option>
                                        <option th:each="e : ${difficultyOptions}" th:value="${e.key}" th:text="${e.value}" th:selected="${fDifficulty == e.key}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button type="submit" class="btn btn-sm btn-primary w-100"><i class="bi bi-funnel me-1"></i>Apply</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body small text-muted">
                            <i class="bi bi-shield-lock me-1"></i> Coding problems are a study-only library. Submitted code is never executed inside this application.
                        </div>
                    </div>

                    <div class="row g-3" th:if="${!problems.isEmpty()}">
                        <div class="col-md-6" th:each="p : ${problems}">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge text-bg-info" th:text="${p.categoryLabel}">Category</span>
                                        <span class="badge"
                                              th:classappend="${p.difficulty == 'HARD'} ? 'text-bg-danger' : (${p.difficulty == 'MEDIUM'} ? 'text-bg-warning' : 'text-bg-success')"
                                              th:text="${p.difficulty}">EASY</span>
                                    </div>
                                    <h2 class="h6" th:text="${#strings.abbreviate(p.questionText, 90)}">Problem</h2>
                                    <div class="small text-muted mb-2 flex-grow-1" th:if="${p.tags != null}"><i class="bi bi-tags me-1"></i><span th:text="${p.tags}">tags</span></div>
                                    <a th:href="@{/student/practice/coding/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info align-self-start">
                                        <i class="bi bi-eye me-1"></i> View problem
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" th:if="${problems.isEmpty()}">
                        <div class="card-body empty-state">
                            <i class="bi bi-code-slash"></i>
                            <h3 class="h5">No coding problems yet</h3>
                            <p>The library will be populated soon.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
