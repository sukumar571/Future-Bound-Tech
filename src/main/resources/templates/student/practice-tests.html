<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('practice')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h4 mb-0"><i class="bi bi-clipboard-check me-2 text-success"></i>Mock Tests</h1>
                        <a th:href="@{/student/practice}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Practice</a>
                    </div>

                    <div class="row g-3" th:if="${!tests.isEmpty()}">
                        <div class="col-md-6" th:each="t : ${tests}">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body d-flex flex-column">
                                    <h2 class="h6" th:text="${t.title}">Test</h2>
                                    <p class="small text-muted flex-grow-1" th:text="${t.description} ?: ''">Description</p>
                                    <ul class="list-unstyled small mb-3">
                                        <li><i class="bi bi-list-ol me-2 text-primary"></i><span th:text="${t.questionCount}">0</span> questions · <span th:text="${t.totalMarks}">0</span> marks</li>
                                        <li><i class="bi bi-clock me-2 text-primary"></i><span th:text="${t.durationMinutes != null} ? ${t.durationMinutes} + ' min' : 'Untimed'"></span></li>
                                        <li><i class="bi bi-trophy me-2 text-primary"></i>Passing: <span th:text="${t.passingMarks != null} ? ${t.passingMarks} + ' marks' : '50%'"></span></li>
                                        <li th:if="${t.myAttempts > 0}"><i class="bi bi-graph-up me-2 text-success"></i>Attempts: <span th:text="${t.myAttempts}"></span><span th:if="${t.myBestPercent != null}"> · Best: <span th:text="${t.myBestPercent} + '%'"></span></span></li>
                                    </ul>
                                    <a th:href="@{/student/practice/tests/{id}/take(id=${t.id})}" class="btn btn-sm btn-success align-self-start">
                                        <i class="bi bi-play-fill me-1"></i> <span th:text="${t.myAttempts > 0} ? 'Retake test' : 'Start test'">Start test</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" th:if="${tests.isEmpty()}">
                        <div class="card-body empty-state">
                            <i class="bi bi-clipboard-check"></i>
                            <h3 class="h5">No mock tests available</h3>
                            <p>Mock tests will appear here once published.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
