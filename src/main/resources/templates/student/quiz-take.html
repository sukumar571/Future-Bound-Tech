<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row justify-content-center g-4">
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <p class="mb-2">
                        <a th:href="@{/student/quizzes}" class="text-decoration-none small">
                            <i class="bi bi-arrow-left"></i> Back to Quizzes
                        </a>
                    </p>
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <h1 class="h4 mb-1" th:text="${quiz.title}">Quiz</h1>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-journal me-1"></i><span th:text="${quiz.courseTitle}">Course</span>
                                <span class="ms-3"><i class="bi bi-list-ol me-1"></i><span th:text="${#lists.size(quiz.questions)}">0</span> questions</span>
                                <span class="ms-3"><i class="bi bi-trophy me-1"></i>Pass: <span th:text="${quiz.passingScore} + '%'"></span></span>
                            </p>
                            <p class="small text-danger mb-3" th:if="${quiz.timeLimitMinutes > 0}">
                                <i class="bi bi-clock me-1"></i>Time limit: <span th:text="${quiz.timeLimitMinutes} + ' minutes'"></span>
                            </p>
                        </div>
                        <div class="card-body px-4 pb-4">
                            <form th:action="@{/student/quizzes/{id}/submit(id=${quiz.quizId})}" method="post">
                                <div class="mb-4 pb-3 border-bottom" th:each="q, qIter : ${quiz.questions}">
                                    <p class="fw-semibold mb-2">
                                        <span class="badge text-bg-primary me-2" th:text="${qIter.count}">1</span>
                                        <span th:text="${q.questionText}">Question</span>
                                    </p>
                                    <div class="ms-4">
                                        <label class="quiz-option d-block mb-2" th:each="opt : ${q.options}">
                                            <input type="radio" th:name="'answer-' + ${q.id}" th:value="${opt.key}"
                                                   th:id="'q' + ${q.id} + ${opt.key}" required="${qIter.index == 0}">
                                            <span class="fw-semibold me-1" th:text="${opt.key} + '.'">A.</span>
                                            <span th:text="${opt.text}">Option</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center" th:if="${!quiz.questions.isEmpty()}">
                                    <span class="text-muted small">Answer all questions before submitting.</span>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-send me-1"></i> Submit Quiz
                                    </button>
                                </div>
                                <div class="alert alert-warning mb-0" th:if="${quiz.questions.isEmpty()}">
                                    This quiz has no questions yet. Please check back later.
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
