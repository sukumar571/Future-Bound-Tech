<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm text-center p-4 p-md-5">
                        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle"
                             style="width:72px;height:72px;background:#FEE2E2;color:#DC2626;">
                            <i class="bi bi-x-lg" style="font-size:2.2rem;"></i>
                        </div>
                        <h1 class="h4 fw-bold mb-1">Payment not completed</h1>
                        <p class="text-muted mb-4">
                            Your enrollment has <strong>not</strong> been activated and you have
                            <strong>not</strong> been charged. You can try again below.
                        </p>
                        <div class="alert alert-warning text-start small" th:if="${reason}" th:text="${reason}">
                            Reason
                        </div>

                        <div class="d-flex gap-2 justify-content-center mt-2">
                            <a th:if="${courseSlug}"
                               th:href="@{/student/checkout(slug=${courseSlug})}"
                               class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i> Try again</a>
                            <a th:href="@{/student/payments}" class="btn btn-outline-secondary">View payments</a>
                            <a th:href="@{/courses}" class="btn btn-link">Browse courses</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
