<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('announcements')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1 class="h4 mb-0">
                            <i class="bi bi-megaphone me-2 text-primary"></i>Announcements
                        </h1>
                        <span class="text-muted small" th:text="${#lists.size(announcements)} + ' post(s)'">0</span>
                    </div>

                    <div class="card border-0 shadow-sm mb-3" th:each="a : ${announcements}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                                <h2 class="h5 mb-0" th:text="${a.title}">Title</h2>
                                <span class="badge text-bg-light text-nowrap" th:text="${a.scope}">Scope</span>
                            </div>
                            <p class="mb-2" style="white-space:pre-line" th:text="${a.content}">Content</p>
                            <small class="text-muted"
                                   th:text="${#temporals.format(a.createdAt, 'MMM d, yyyy h:mm a')}">Date</small>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" th:if="${announcements.isEmpty()}">
                        <div class="card-body empty-state">
                            <i class="bi bi-megaphone"></i>
                            <h3 class="h5">No announcements yet</h3>
                            <p>Notices from your institute and batches will appear here.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
