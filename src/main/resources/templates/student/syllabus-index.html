<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('syllabus')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <h1 class="h4 mb-4"><i class="bi bi-list-check me-2 text-primary"></i>My Syllabus</h1>
                    <p class="text-muted">Select a course to view its modules, lessons and track your progress.</p>

                    <div class="list-group shadow-sm" th:if="${!courses.isEmpty()}">
                        <a th:each="course : ${courses}"
                           th:href="@{/student/courses/{id}/syllabus(id=${course.courseId})}"
                           class="list-group-item list-group-item-action">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h2 class="h6 mb-1" th:text="${course.title}">Course</h2>
                                    <small class="text-muted">
                                        <i class="bi bi-check2-circle me-1"></i><span
                                            th:text="${course.completedLessons} + ' / ' + ${course.totalLessons} + ' lessons'"></span>
                                    </small>
                                </div>
                                <div class="text-end">
                                    <span class="badge text-bg-primary mb-1" th:text="${course.progressPercent} + '%'"></span>
                                    <div class="progress" style="width: 140px; height: 6px;">
                                        <div class="progress-bar" th:style="'width:' + ${course.progressPercent} + '%'"></div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="card border-0 shadow-sm" th:if="${courses.isEmpty()}">
                        <div class="card-body empty-state">
                            <i class="bi bi-list-task"></i>
                            <h3 class="h5">No syllabus available</h3>
                            <p>Enroll in a course to see its syllabus.</p>
                            <a th:href="@{/courses}" class="btn btn-primary">Browse Courses</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
