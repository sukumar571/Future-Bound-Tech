<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('practice')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h1 class="h4 mb-0"><i class="bi bi-clipboard-check me-2 text-success"></i><span th:text="${test.title}">Test</span></h1>
                            <p class="text-muted small mb-0" th:if="${test.description}" th:text="${test.description}">Description</p>
                        </div>
                        <div class="text-end">
                            <div class="small text-muted"><span th:text="${test.questions.size()}">0</span> questions · <span th:text="${test.totalMarks}">0</span> marks</div>
                            <div class="fs-4 fw-bold text-danger" th:if="${test.durationMinutes != null and test.durationMinutes > 0}">
                                <i class="bi bi-stopwatch me-1"></i><span id="timer" data-duration="0" th:attr="data-duration=${test.durationMinutes}">--:--</span>
                            </div>
                            <div class="small text-muted" th:if="${test.durationMinutes == null or test.durationMinutes <= 0}">Untimed</div>
                        </div>
                    </div>

                    <form th:action="@{/student/practice/tests/{id}/submit(id=${test.id})}" method="post" id="takeForm">
                        <div class="accordion" id="questionsAccordion">
                            <div class="accordion-item" th:each="q, iterStat : ${test.questions}">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                            th:attr="data-bs-target='#qcollapse' + ${iterStat.index}"
                                            th:classappend="${iterStat.index > 0} ? 'collapsed'">
                                        <span class="me-2 text-muted" th:text="${iterStat.count} + '.'"></span>
                                        <span th:text="${#strings.abbreviate(q.questionText, 80)}">Question</span>
                                        <span class="badge text-bg-light ms-2" th:text="${q.marks} + ' marks'"></span>
                                    </button>
                                </h2>
                                <div th:attr="id='qcollapse' + ${iterStat.index}" class="accordion-collapse collapse"
                                     th:classappend="${iterStat.index == 0} ? 'show'" data-bs-parent="#questionsAccordion">
                                    <div class="accordion-body">
                                        <p class="mb-3" th:text="${q.questionText}">Question text</p>
                                        <div class="mb-2" th:if="${q.optionA != null}">
                                            <input class="btn-check" type="radio" th:id="'q' + ${q.id} + 'a'"
                                                   th:name="'answer_' + ${q.id}" value="A">
                                            <label class="d-block border rounded p-2 mb-1" th:for="'q' + ${q.id} + 'a'">
                                                <span class="fw-bold me-2">A.</span><span th:text="${q.optionA}">Option A</span>
                                            </label>
                                        </div>
                                        <div class="mb-2" th:if="${q.optionB != null}">
                                            <input class="btn-check" type="radio" th:id="'q' + ${q.id} + 'b'"
                                                   th:name="'answer_' + ${q.id}" value="B">
                                            <label class="d-block border rounded p-2 mb-1" th:for="'q' + ${q.id} + 'b'">
                                                <span class="fw-bold me-2">B.</span><span th:text="${q.optionB}">Option B</span>
                                            </label>
                                        </div>
                                        <div class="mb-2" th:if="${q.optionC != null}">
                                            <input class="btn-check" type="radio" th:id="'q' + ${q.id} + 'c'"
                                                   th:name="'answer_' + ${q.id}" value="C">
                                            <label class="d-block border rounded p-2 mb-1" th:for="'q' + ${q.id} + 'c'">
                                                <span class="fw-bold me-2">C.</span><span th:text="${q.optionC}">Option C</span>
                                            </label>
                                        </div>
                                        <div class="mb-2" th:if="${q.optionD != null}">
                                            <input class="btn-check" type="radio" th:id="'q' + ${q.id} + 'd'"
                                                   th:name="'answer_' + ${q.id}" value="D">
                                            <label class="d-block border rounded p-2 mb-1" th:for="'q' + ${q.id} + 'd'">
                                                <span class="fw-bold me-2">D.</span><span th:text="${q.optionD}">Option D</span>
                                            </label>
                                        </div>
                                        <div class="small text-muted">
                                            <span class="badge text-bg-info" th:text="${q.categoryLabel}">Category</span>
                                            <span class="badge"
                                                  th:classappend="${q.difficulty == 'HARD'} ? 'text-bg-danger' : (${q.difficulty == 'MEDIUM'} ? 'text-bg-warning' : 'text-bg-success')"
                                                  th:text="${q.difficulty}">EASY</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm mt-3">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <a th:href="@{/student/practice/tests}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle me-1"></i>Submit test</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        (function () {
            var el = document.getElementById('timer');
            if (!el) return;
            var minutes = parseInt(el.getAttribute('data-duration'), 10);
            if (!minutes || minutes <= 0) return;
            var deadline = Date.now() + minutes * 60 * 1000;
            var form = document.getElementById('takeForm');
            function tick() {
                var remaining = Math.floor((deadline - Date.now()) / 1000);
                if (remaining <= 0) {
                    el.textContent = '00:00';
                    if (!form.dataset.submitted) {
                        form.dataset.submitted = '1';
                        form.submit();
                    }
                    return;
                }
                var m = Math.floor(remaining / 60);
                var s = remaining % 60;
                el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            }
            tick();
            setInterval(tick, 1000);
        })();
    </script>
</body>
</html>
