<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="student-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div th:replace="~{fragments/student-sidebar :: studentSidebar('payments')}"></div>
                </div>
                <div class="col-lg-9">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <h1 class="h4 mb-4"><i class="bi bi-credit-card me-2 text-primary"></i>Payment History</h1>

                    <div class="card border-0 shadow-sm" th:if="${!payments.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Course</th>
                                        <th>Receipt</th>
                                        <th class="text-end">Amount</th>
                                        <th>Method</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${payments}">
                                        <td>
                                            <a class="text-decoration-none fw-semibold"
                                               th:href="@{/student/courses/{id}(id=${p.courseId})}" th:text="${p.courseTitle}">Course</a>
                                        </td>
                                        <td class="small text-muted">
                                            <a th:if="${p.status == 'SUCCESS' or p.status == 'REFUNDED'}"
                                               th:href="@{/student/payments/{id}/receipt(id=${p.id})}"
                                               class="text-decoration-none" th:text="${p.receiptNumber}">FBT-0000</a>
                                            <span th:unless="${p.status == 'SUCCESS' or p.status == 'REFUNDED'}"
                                                  th:text="${p.receiptNumber} ?: '—'">—</span>
                                        </td>
                                        <td class="text-end">
                                            <span th:text="${p.currency} + ' ' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}">₹0</span>
                                            <br><small class="text-success" th:if="${p.discountAmount != null and p.discountAmount.doubleValue() > 0}"
                                                 th:text="'saved ' + ${p.currency} + ' ' + ${#numbers.formatDecimal(p.discountAmount, 1, 'COMMA', 2, 'POINT')}"></small>
                                        </td>
                                        <td class="small" th:text="${p.paymentMethod} ?: '—'">—</td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${p.status == 'SUCCESS'} ? 'text-bg-success' :
                                                                  (${p.status == 'PENDING' or p.status == 'CREATED'} ? 'text-bg-warning' :
                                                                  (${p.status == 'REFUNDED'} ? 'text-bg-info' : 'text-bg-danger'))"
                                                  th:text="${p.status}">STATUS</span>
                                        </td>
                                        <td class="small"
                                            th:text="${p.paidAt != null} ? ${#temporals.format(p.paidAt, 'MMM d, yyyy')} : ${#temporals.format(p.createdAt, 'MMM d, yyyy')}">Date</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" th:if="${payments.isEmpty()}">
                        <div class="card-body empty-state">
                            <i class="bi bi-receipt"></i>
                            <h3 class="h5">No payments yet</h3>
                            <p>Your payment receipts will appear here after you enroll in a paid course.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
