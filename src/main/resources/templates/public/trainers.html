<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="page-header">
        <div class="container">
            <div class="page-header-content">
                <h1 class="page-header-title">Our Trainers</h1>
                <p class="page-header-subtitle">Learn from experienced professionals who build real products.</p>
            </div>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <div th:if="${#lists.isEmpty(trainers)}" class="text-center py-5">
                <i class="bi bi-person-video3" style="font-size: 3rem; color: var(--gray-400);"></i>
                <p class="mt-3" style="color: var(--gray-500);">Trainer profiles are being prepared. Check back soon.</p>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="tr : ${trainers}">
                    <div class="card h-100 border-0 shadow-sm text-center" style="border-radius: var(--radius-lg);">
                        <div class="card-body p-4">
                            <div class="mx-auto mb-3" style="width: 96px; height: 96px;">
                                <img th:if="${tr.photoUrl != null}" th:src="${tr.photoUrl}" th:alt="${tr.fullName}"
                                     class="rounded-circle" style="width: 96px; height: 96px; object-fit: cover;">
                                <div th:unless="${tr.photoUrl != null}"
                                     class="rounded-circle d-flex align-items-center justify-content-center"
                                     style="width: 96px; height: 96px; background: var(--gradient-hero); color: #fff; font-size: 2rem; font-weight: 700;"
                                     th:text="${tr.firstName != null} ? ${#strings.substring(tr.firstName, 0, 1)} : '?'">T</div>
                            </div>
                            <h5 class="mb-1" style="font-weight: 700;" th:text="${tr.fullName}">Trainer Name</h5>
                            <p class="text-muted small mb-2" th:if="${tr.expertise}" th:text="${tr.expertise}">Expertise</p>
                            <div class="d-flex justify-content-center gap-2 flex-wrap mb-3">
                                <span class="badge rounded-pill" style="background: var(--gray-200); color: var(--gray-700);"
                                      th:if="${tr.experienceYears != null}" th:text="${tr.experienceYears} + ' yrs experience'"></span>
                                <span class="badge rounded-pill" style="background: var(--gray-200); color: var(--gray-700);"
                                      th:text="${tr.courseCount} + (${tr.courseCount} == 1 ? ' course' : ' courses')"></span>
                            </div>
                            <a th:href="@{'/trainers/' + ${tr.id}}" class="btn-fbt-outline">
                                View Profile <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="bi bi-chevron-up"></i></button>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
