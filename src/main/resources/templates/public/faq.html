<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="page-header">
        <div class="container">
            <div class="page-header-content">
                <h1 class="page-header-title">Frequently Asked Questions</h1>
                <p class="page-header-subtitle">Everything you need to know before you start learning with us.</p>
            </div>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div th:if="${#lists.isEmpty(faqs)}" class="text-center py-5">
                        <i class="bi bi-chat-dots" style="font-size: 3rem; color: var(--gray-400);"></i>
                        <p class="mt-3" style="color: var(--gray-500);">FAQs are being prepared. Please check back soon.</p>
                    </div>

                    <div th:unless="${#lists.isEmpty(faqs)}" class="accordion fbt-accordion" id="faqAccordion">
                        <div class="accordion-item fbt-accordion-item" th:each="faq, iter : ${faqs}">
                            <h2 class="accordion-header">
                                <button class="accordion-button fbt-accordion-btn" type="button"
                                        data-bs-toggle="collapse" th:attr="data-bs-target='#faq' + ${iter.index}"
                                        th:classappend="${!iter.first} ? ' collapsed'">
                                    <span th:text="${faq.question}">Question</span>
                                </button>
                            </h2>
                            <div th:id="'faq' + ${iter.index}"
                                 class="accordion-collapse collapse"
                                 th:classappend="${iter.first} ? ' show'"
                                 data-bs-parent="#faqAccordion">
                                <div class="accordion-body fbt-accordion-body">
                                    <span th:text="${faq.answer}">Answer</span>
                                    <div class="mt-2" th:if="${faq.category != null}">
                                        <span class="badge rounded-pill" style="background: var(--gray-200); color: var(--gray-700);"
                                              th:text="${faq.category}">Category</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-5">
                        <p style="color: var(--gray-500);">Still have questions?</p>
                        <a th:href="@{/contact}" class="btn-primary-fbt" style="padding: 12px 32px;">
                            <i class="bi bi-headset me-2"></i> Contact Us
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="bi bi-chevron-up"></i></button>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
