<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="page-header">
        <div class="container">
            <div class="page-header-content">
                <h1 class="page-header-title" th:text="${trainer.fullName}">Trainer</h1>
                <p class="page-header-subtitle" th:if="${trainer.expertise}" th:text="${trainer.expertise}">Expertise</p>
            </div>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm text-center" style="border-radius: var(--radius-lg);">
                        <div class="card-body p-4">
                            <div class="mx-auto mb-3" style="width: 140px; height: 140px;">
                                <img th:if="${trainer.photoUrl != null}" th:src="${trainer.photoUrl}" th:alt="${trainer.fullName}"
                                     class="rounded-circle" style="width: 140px; height: 140px; object-fit: cover;">
                                <div th:unless="${trainer.photoUrl != null}"
                                     class="rounded-circle d-flex align-items-center justify-content-center"
                                     style="width: 140px; height: 140px; background: var(--gradient-hero); color: #fff; font-size: 3rem; font-weight: 700;"
                                     th:text="${trainer.firstName != null} ? ${#strings.substring(trainer.firstName, 0, 1)} : '?'">T</div>
                            </div>
                            <h4 class="mb-1" style="font-weight: 700;" th:text="${trainer.fullName}">Trainer</h4>
                            <div class="d-flex justify-content-center gap-2 flex-wrap mt-2">
                                <span class="badge rounded-pill" style="background: var(--gray-200); color: var(--gray-700);"
                                      th:if="${trainer.experienceYears != null}" th:text="${trainer.experienceYears} + ' yrs experience'"></span>
                                <span class="badge rounded-pill" style="background: var(--gray-200); color: var(--gray-700);"
                                      th:text="${#lists.size(courseTitles)} + (${#lists.size(courseTitles)} == 1 ? ' course' : ' courses')"></span>
                            </div>
                            <a th:href="@{/trainers}" class="btn-fbt-outline mt-4 d-inline-block">
                                <i class="bi bi-arrow-left me-1"></i> All Trainers
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm mb-4" style="border-radius: var(--radius-lg);">
                        <div class="card-body p-4">
                            <h5 class="mb-3" style="font-weight: 700;"><i class="bi bi-person-lines-fill me-2"></i>About</h5>
                            <p th:if="${trainer.bio != null}" th:text="${trainer.bio}" style="color: var(--gray-700); line-height: 1.7;">Bio</p>
                            <p th:unless="${trainer.bio != null}" class="text-muted">This trainer has not added a biography yet.</p>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg);">
                        <div class="card-body p-4">
                            <h5 class="mb-3" style="font-weight: 700;"><i class="bi bi-journal-bookmark me-2"></i>Courses</h5>
                            <p th:if="${#lists.isEmpty(courseTitles)}" class="text-muted mb-0">No publicly listed courses yet.</p>
                            <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(courseTitles)}">
                                <li class="list-group-item px-0" th:each="title : ${courseTitles}">
                                    <i class="bi bi-check-circle text-success me-2"></i>
                                    <a th:href="@{/courses}" class="text-decoration-none" th:text="${title}">Course</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="bi bi-chevron-up"></i></button>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
