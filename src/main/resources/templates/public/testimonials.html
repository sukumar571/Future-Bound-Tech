<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/navbar :: navbar-spacer}"></div>

    <section class="page-header">
        <div class="container">
            <div class="page-header-content">
                <h1 class="page-header-title">Student Testimonials</h1>
                <p class="page-header-subtitle">Real stories from learners who built their futures with us.</p>
            </div>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <div th:if="${#lists.isEmpty(testimonials)}" class="text-center py-5">
                <i class="bi bi-star" style="font-size: 3rem; color: var(--gray-400);"></i>
                <p class="mt-3" style="color: var(--gray-500);">Testimonials are coming soon.</p>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="t : ${testimonials}">
                    <div class="card h-100 border-0 shadow-sm" style="border-radius: var(--radius-lg);">
                        <div class="card-body d-flex flex-column p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div class="text-warning">
                                    <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, 5)}"
                                       th:classappend="${i <= (t.rating ?: 0)} ? '' : ' text-secondary'"></i>
                                </div>
                                <span class="badge rounded-pill" th:if="${t.demo}"
                                      style="background: var(--gray-200); color: var(--gray-700);">Demo</span>
                            </div>
                            <p class="flex-grow-1" style="color: var(--gray-700); line-height: 1.6;"
                               th:text="'“' + ${t.comment} + '”'">“Quote”</p>
                            <div class="d-flex align-items-center gap-3 mt-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center"
                                     style="width: 44px; height: 44px; background: var(--gradient-hero); color: #fff; font-weight: 700;"
                                     th:text="${t.authorName != null} ? ${#strings.arraySplit(t.authorName, ' ')[0]} : '?'">A</div>
                                <div>
                                    <div style="font-weight: 700; color: var(--gray-900);"
                                         th:text="${t.authorName != null} ? ${t.authorName} : 'Anonymous'">Author</div>
                                    <div style="font-size: 0.85rem; color: var(--gray-500);"
                                         th:if="${t.contextLabel != null}" th:text="${t.contextLabel}">Context</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5" th:unless="${#lists.isEmpty(testimonials)}">
                <a th:href="@{/courses}" class="btn-primary-fbt" style="padding: 12px 32px;">
                    <i class="bi bi-journal-bookmark me-2"></i> Explore Courses
                </a>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="bi bi-chevron-up"></i></button>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
