# ================================================================
# Future Bound Tech — nginx reverse proxy (HTTPS termination)
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/future-bound-tech
#          sudo ln -s /etc/nginx/sites-available/future-bound-tech /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace <your-domain> with the REAL domain you own (A record -> this
# server). Certificate paths below are the standard certbot locations;
# obtain the certificate first:
#   sudo certbot --nginx -d <your-domain>
# certbot renews automatically and rewrites these lines for you.
# ================================================================

# Plain HTTP: redirect everything to HTTPS (Razorpay webhooks and browsers
# must never traverse HTTP in production).
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <your-domain>;

    # certbot-managed paths (created by `certbot --nginx`)
    ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Lesson PDFs / assignment uploads travel through here.
    client_max_body_size 12m;

    # Security response headers (the app also sets X-Frame-Options / HSTS;
    # these complement it at the edge).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/future-bound-tech.access.log;
    error_log  /var/log/nginx/future-bound-tech.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The app runs with server.forward-headers-strategy=native, so these
        # are what make redirects and secure cookies work over HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
